name: note-hub

# All persistent data under ./DATA (bind mounts).
# First run: cp .env.example .env && change HUB_SECRET && docker compose up --build
# Infra ports (postgres/redis/minio) bind to 127.0.0.1 only.

x-dns: &default-dns
  - 1.1.1.1
  - 8.8.8.8

x-app-env: &app-env
  DATABASE_URL: postgres://notehub:notehub@postgres:5432/notehub
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGION: us-east-1
  S3_BUCKET: hub-dev
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_FORCE_PATH_STYLE: "true"
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  NEXT_PUBLIC_API_URL: http://api:3001
  API_PORT: "3001"
  VAULT_BUCKET: obsidian-src
  NOTE_HUB_ROOT: /app
  NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
  NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
  NOTION_REDIRECT_URI: ${NOTION_REDIRECT_URI:-http://127.0.0.1:3000/v1/connections/oauth/notion/callback}
  FEISHU_APP_ID: ${FEISHU_APP_ID:-}
  FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
  FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-http://127.0.0.1:3000/v1/connections/oauth/feishu/callback}
  HUB_SECRET: ${HUB_SECRET:?missing_HUB_SECRET_copy_dotenv_example}
  # ── 账号与安全防护（见 .env.example）────────────────────
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
  LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
  LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
  LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
  REGISTER_MAX_PER_IP: ${REGISTER_MAX_PER_IP:-5}
  REGISTER_WINDOW_MINUTES: ${REGISTER_WINDOW_MINUTES:-60}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBED_PROVIDER: ${EMBED_PROVIDER:-api}
  EMBED_MODEL_DIR: /data/models

services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: notehub
      POSTGRES_PASSWORD: notehub
      POSTGRES_DB: notehub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${DATA_DIR:-./DATA}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ${DATA_DIR:-./DATA}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    restart: unless-stopped
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${DATA_DIR:-./DATA}/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  migrate:
    dns: *default-dns
    image: note-hub-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "--filter", "@note-hub/api", "migrate"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    restart: unless-stopped
    dns: *default-dns
    image: note-hub-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    volumes:
      - ${DATA_DIR:-./DATA}/models:/data/models
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    restart: unless-stopped
    dns: *default-dns
    image: note-hub-worker
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    volumes:
      - ${DATA_DIR:-./DATA}/models:/data/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    restart: unless-stopped
    dns: *default-dns
    image: note-hub-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://api:3001
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

