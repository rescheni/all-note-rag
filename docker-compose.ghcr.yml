name: note-hub

# Pre-built images from GHCR (no local Docker build).
#   cp .env.example .env    # set a strong HUB_SECRET
#   export NOTE_HUB_TAG=0.1.0   # optional; default latest
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Pull manually:
#   docker pull ghcr.io/rescheni/note-hub-api:${NOTE_HUB_TAG:-latest}
#   docker pull ghcr.io/rescheni/note-hub-worker:${NOTE_HUB_TAG:-latest}
#   docker pull ghcr.io/rescheni/note-hub-web:${NOTE_HUB_TAG:-latest}

x-app-env: &app-env
  DATABASE_URL: postgres://notehub:notehub@postgres:5432/notehub
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: hub-dev
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_FORCE_PATH_STYLE: "true"
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  NEXT_PUBLIC_API_URL: http://api:3001
  API_PORT: "3001"
  VAULT_BUCKET: obsidian-src
  NOTE_HUB_ROOT: /app
  NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
  NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
  NOTION_REDIRECT_URI: ${NOTION_REDIRECT_URI:-http://127.0.0.1:3000/v1/connections/oauth/notion/callback}
  FEISHU_APP_ID: ${FEISHU_APP_ID:-}
  FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
  FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-http://127.0.0.1:3000/v1/connections/oauth/feishu/callback}
  HUB_SECRET: ${HUB_SECRET:?missing_HUB_SECRET_copy_dotenv_example}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBED_PROVIDER: ${EMBED_PROVIDER:-api}
  EMBED_MODEL_DIR: /data/models

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: notehub
      POSTGRES_PASSWORD: notehub
      POSTGRES_DB: notehub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./DATA/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./DATA/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./DATA/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command: "mc mb -p local/hub-dev && mc mb -p local/obsidian-src && mc mb -p local/siyuan-src && echo minio buckets ready"

  migrate:
    image: ghcr.io/rescheni/note-hub-api:${NOTE_HUB_TAG:-latest}
    command: ["pnpm", "--filter", "@note-hub/api", "migrate"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/rescheni/note-hub-api:${NOTE_HUB_TAG:-latest}
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    volumes:
      - ./DATA/models:/data/models
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    image: ghcr.io/rescheni/note-hub-worker:${NOTE_HUB_TAG:-latest}
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    volumes:
      - ./DATA/models:/data/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/rescheni/note-hub-web:${NOTE_HUB_TAG:-latest}
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
